# EduVerify India — local demo configuration
spring.application.name=eduverify-india
server.port=${PORT:8080}

# In-memory H2 database: no separate database installation required
spring.datasource.url=jdbc:h2:mem:eduverifydb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Explicit dialect avoids Hibernate trying to infer it before connecting
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

# Optional local database console
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
server.error.include-message=always
# Demo file-upload limits
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=20MB
